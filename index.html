<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background: #242424;
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #333;
        }

        h1 {
            font-size: 1.8rem;
            color: #e0e0e0;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }

        .stats {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .user-id-section {
            margin-bottom: 1.5rem;
            padding: 0.75rem;
            background: #2a2a2a;
            border-radius: 4px;
            border: 1px solid #3a3a3a;
        }

        .user-id-section label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .user-id-section input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-size: 0.85rem;
            background: #1a1a1a;
            color: #e0e0e0;
        }

        .user-id-section small {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #666;
        }

        .input-area {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        #task-input {
            flex-grow: 1;
            padding: 0.7rem;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-size: 0.95rem;
            background: #2a2a2a;
            color: #e0e0e0;
        }

        #task-input:focus {
            outline: none;
            border-color: #4a4a4a;
        }

        #task-input::placeholder {
            color: #666;
        }

        #add-task-btn {
            padding: 0.7rem 1.2rem;
            border: none;
            background: #3a3a3a;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        #add-task-btn:hover {
            background: #444;
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .filter-btn {
            padding: 0.4rem 0.8rem;
            border: 1px solid #3a3a3a;
            background: #2a2a2a;
            color: #888;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .filter-btn:hover {
            background: #333;
        }

        .filter-btn.active {
            background: #3a3a3a;
            color: #e0e0e0;
            border-color: #4a4a4a;
        }

        #task-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        #task-list::-webkit-scrollbar {
            width: 6px;
        }

        #task-list::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        #task-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.75rem;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 0.5rem;
            border: 1px solid #333;
        }

        .task-item:hover {
            background: #2e2e2e;
        }

        .task-item.completed {
            opacity: 0.5;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-radius: 3px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-item.completed .checkbox {
            background: #555;
            position: relative;
        }

        .task-item.completed .checkbox::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 2px;
            color: #e0e0e0;
            font-size: 0.75rem;
        }

        .task-text {
            flex-grow: 1;
            cursor: pointer;
            user-select: none;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .delete-btn {
            border: none;
            background: none;
            color: #666;
            padding: 0;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
        }

        .delete-btn:hover {
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .clear-completed {
            margin-top: 1rem;
            text-align: center;
        }

        .clear-completed button {
            padding: 0.5rem 1rem;
            border: 1px solid #3a3a3a;
            background: #2a2a2a;
            color: #888;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .clear-completed button:hover {
            background: #333;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .input-area {
                flex-direction: column;
            }

            #add-task-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tarefas</h1>
        <div class="stats">
            <span id="task-count">0 tarefas</span> · 
            <span id="completed-count">0 concluídas</span>
        </div>

        <div class="user-id-section">
            <label>Seu ID de usuário (para sincronizar entre dispositivos)</label>
            <input type="text" id="user-id" placeholder="Digite um ID único (ex: joao123)">
            <small>Use o mesmo ID em todos os seus dispositivos para sincronizar as tarefas</small>
        </div>
        
        <div class="input-area">
            <input type="text" id="task-input" placeholder="Nova tarefa..." autocomplete="off">
            <button id="add-task-btn">Adicionar</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Ativas</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <ul id="task-list"></ul>

        <div class="clear-completed" id="clear-completed-container" style="display: none;">
            <button id="clear-completed-btn">Limpar concluídas</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const taskInput = document.getElementById('task-input');
            const addTaskBtn = document.getElementById('add-task-btn');
            const taskList = document.getElementById('task-list');
            const taskCount = document.getElementById('task-count');
            const completedCount = document.getElementById('completed-count');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const clearCompletedContainer = document.getElementById('clear-completed-container');
            const userIdInput = document.getElementById('user-id');

            let currentFilter = 'all';
            let tasks = [];

            // Gera ou recupera ID do usuário
            const getUserId = () => {
                let userId = localStorage.getItem('userId');
                if (!userId && userIdInput.value.trim()) {
                    userId = userIdInput.value.trim();
                    localStorage.setItem('userId', userId);
                } else if (!userId) {
                    userId = 'user_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('userId', userId);
                }
                return userId;
            };

            // Carrega o userId salvo
            const savedUserId = localStorage.getItem('userId');
            if (savedUserId) {
                userIdInput.value = savedUserId;
            }

            // Salva userId quando mudar
            userIdInput.addEventListener('change', () => {
                if (userIdInput.value.trim()) {
                    localStorage.setItem('userId', userIdInput.value.trim());
                    loadTasks();
                }
            });

            const getStorageKey = () => {
                return 'tasks_' + getUserId();
            };

            const loadTasks = () => {
                const stored = localStorage.getItem(getStorageKey());
                tasks = stored ? JSON.parse(stored) : [];
                renderTasks();
            };

            const saveTasks = () => {
                localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
            };

            const updateStats = () => {
                const total = tasks.length;
                const completed = tasks.filter(t => t.completed).length;
                taskCount.textContent = `${total} ${total === 1 ? 'tarefa' : 'tarefas'}`;
                completedCount.textContent = `${completed} ${completed === 1 ? 'concluída' : 'concluídas'}`;
                
                clearCompletedContainer.style.display = completed > 0 ? 'block' : 'none';
            };

            const renderTasks = () => {
                taskList.innerHTML = '';
                
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true;
                });

                if (filteredTasks.length === 0) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'empty-state';
                    emptyState.textContent = currentFilter === 'completed' ? 
                        'Nenhuma tarefa concluída' : 'Nenhuma tarefa';
                    taskList.appendChild(emptyState);
                } else {
                    filteredTasks.forEach((task) => {
                        const li = document.createElement('li');
                        li.className = 'task-item';
                        if (task.completed) li.classList.add('completed');

                        const checkbox = document.createElement('div');
                        checkbox.className = 'checkbox';
                        checkbox.addEventListener('click', () => toggleTask(task.id));

                        const span = document.createElement('span');
                        span.className = 'task-text';
                        span.textContent = task.text;
                        span.addEventListener('click', () => toggleTask(task.id));

                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = '×';
                        deleteBtn.addEventListener('click', () => deleteTask(task.id));

                        li.appendChild(checkbox);
                        li.appendChild(span);
                        li.appendChild(deleteBtn);
                        taskList.appendChild(li);
                    });
                }

                updateStats();
            };

            const addTask = () => {
                const taskText = taskInput.value.trim();
                if (taskText) {
                    const newTask = {
                        id: Date.now(),
                        text: taskText,
                        completed: false
                    };
                    tasks.unshift(newTask);
                    taskInput.value = '';
                    saveTasks();
                    renderTasks();
                }
            };

            const toggleTask = (id) => {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    saveTasks();
                    renderTasks();
                }
            };

            const deleteTask = (id) => {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            };

            const clearCompleted = () => {
                tasks = tasks.filter(t => !t.completed);
                saveTasks();
                renderTasks();
            };

            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTasks();
                });
            });

            clearCompletedBtn.addEventListener('click', clearCompleted);

            loadTasks();
        });
    </script>
</body>
</html>
